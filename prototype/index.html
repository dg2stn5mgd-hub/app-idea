<title>Carriage Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single phone-width app column, centred on wider screens. MRT signage feel: station codes in mono, Thomson-East Coast Line brown as the accent. */
:root {
  --bg: #e9ecef;
  --surface: #ffffff;
  --surface-2: #f3f4f6;
  --fg: #1c1f23;
  --muted: #5d636b;
  --line: #d9dde2;
  --accent: #9d5b25;      /* TEL brown */
  --accent-soft: #f4e9df;
  --on-accent: #ffffff;
  --match: #1d7a52;
  --match-soft: #e2f3ea;
  --warn-soft: #fff4d6;
  --warn-fg: #6b4e00;
  --map: #eef1e8;
  --map-edge: #c9cfc3;
  --water: #cfe0ea;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1113; --surface: #181b1e; --surface-2: #22262a; --fg: #e9ebed; --muted: #a2a8af;
    --line: #2f343a; --accent: #d68c4f; --accent-soft: #3a2a1c; --on-accent: #1a1006;
    --match: #4cc38a; --match-soft: #16301f; --warn-soft: #3a3016; --warn-fg: #f1d68a; --map: #1e2421; --map-edge: #3a433e; --water: #101b23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1113; --surface: #181b1e; --surface-2: #22262a; --fg: #e9ebed; --muted: #a2a8af;
  --line: #2f343a; --accent: #d68c4f; --accent-soft: #3a2a1c; --on-accent: #1a1006;
  --match: #4cc38a; --match-soft: #16301f; --warn-soft: #3a3016; --warn-fg: #f1d68a; --map: #1e2421; --map-edge: #3a433e; --water: #101b23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.phone {
  max-width: 420px; margin: 0 auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
  min-height: 640px; display: flex; flex-direction: column;
}
.banner {
  background: var(--warn-soft); color: var(--warn-fg); font-size: 12.5px;
  padding: 8px 18px; text-align: center;
}
.top { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; min-height: 44px; }
.back { background: none; border: 0; color: var(--muted); font: inherit; padding: 6px 0; cursor: pointer; }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots span { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.dots span.on { background: var(--accent); }
main { padding: 10px 18px 22px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.12; }
h2 { font-size: 23px; line-height: 1.2; }
h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
select, input[type="time"], input[type="text"] {
  font: inherit; color: var(--fg); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%;
}
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.btn {
  font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px 16px;
  background: var(--accent); color: var(--on-accent); cursor: pointer; width: 100%;
}
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.small-btn { width: auto; padding: 9px 14px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible, .chip:focus-visible, .rating button:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.spacer { flex: 1; }
.error { color: #c0392b; font-size: 13px; }

/* Line diagram */
.route { display: flex; flex-direction: column; gap: 0; padding: 4px 0; }
.stop { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; min-height: 30px; position: relative; }
.route { --lc: var(--accent); }
.stop .pin { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--lc); background: var(--surface); justify-self: center; z-index: 1; }
.stop.end .pin { background: var(--lc); }
.stop::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 4px; background: var(--lc); }
.stop.gap::before { background: repeating-linear-gradient(var(--lc) 0 4px, transparent 4px 8px); }
.leg { display: flex; flex-direction: column; gap: 4px; }
.leg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.change { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); margin: 6px 0; }
.pill { display: inline-block; color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 6px; vertical-align: 1px; }
.stop:first-child::before { top: 50%; }
.stop:last-child::before { bottom: 50%; }
.stop .code { color: var(--muted); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; border-radius: 999px; padding: 7px 13px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tag { font-size: 12.5px; border-radius: 999px; padding: 3px 9px; background: var(--surface-2); color: var(--muted); }
.tag.shared { background: var(--match-soft); color: var(--match); font-weight: 600; }

/* Segmented control */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 12px; border: 1px solid var(--line); }
.seg button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.rating { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rating button { font: inherit; font-weight: 600; padding: 14px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.rating button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.qa { display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--accent); padding-left: 12px; }
.note.nudge { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--fg); }
.nudge span { flex: 1; min-width: 0; }
.pill-status { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
.pill-status.good { background: var(--match-soft); color: var(--match); }
.pill-status.warn { background: var(--warn-soft); color: var(--warn-fg); }
.card.faded { opacity: 0.7; }
.actions { flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 18px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; }
.search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.search-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.swap { font: inherit; font-size: 20px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; flex: none; }
.map-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.map { display: block; width: 100%; height: auto; }
.map-wrap { position: relative; }
.water { fill: var(--water); }
.land { fill: var(--map); stroke: var(--map-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.net { fill: none; stroke-width: 2.5; opacity: 0.35; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.net-dot { fill: var(--map-edge); }
.ride { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.dot-fill { fill: #ffffff; }
.dot-end { fill: var(--accent); stroke: #ffffff; }
.map-label { font-family: var(--font-body); font-weight: 700; fill: var(--fg); paint-order: stroke; stroke: var(--map); stroke-linejoin: round; }
.map-place { font-family: var(--font-body); font-weight: 500; fill: var(--muted); paint-order: stroke; stroke: var(--map); stroke-linejoin: round; }
.map-toggle { position: absolute; bottom: 10px; right: 10px; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.map-meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 14px; }
.big-time { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.choice { display: flex; flex-direction: column; gap: 8px; }
.center { text-align: center; }
a.btn { display: block; text-align: center; text-decoration: none; }
.stops summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; }
.stops[open] summary { margin-bottom: 8px; }
.tabs button { padding: 10px 4px; font-size: 13.5px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; line-height: 18px; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
section.list > div { display: flex; flex-direction: column; gap: 2px; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); }

/* Match cards */
.list { display: flex; flex-direction: column; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.who { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--font-display); font-weight: 700; color: var(--on-accent); background: var(--accent);
}
.who .meta { min-width: 0; }
.overlap { display: flex; flex-direction: column; gap: 5px; }
.bar { display: flex; gap: 3px; }
.bar span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.bar span.on { background: var(--match); }
.ends { display: flex; justify-content: space-between; gap: 8px; }
.card .actions { display: flex; gap: 8px; align-items: center; }
.status { font-size: 13px; color: var(--match); font-weight: 600; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }

/* Train picker */
.train { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.car {
  font: inherit; border: 2px solid var(--line); background: var(--surface-2); color: var(--fg);
  border-radius: 10px; padding: 14px 0 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.car:first-child { border-top-left-radius: 22px; }
.car:last-child { border-top-right-radius: 22px; }
.car b { font-family: var(--font-display); font-size: 20px; }
.car[aria-pressed="true"] { border-color: var(--match); background: var(--match-soft); color: var(--match); }
.ticket { border: 2px dashed var(--match); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--match-soft); }
.ticket .big { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw;
}
.hero-line { display: flex; align-items: center; gap: 8px; }
.hero-line .seg-line { flex: 1; height: 5px; background: var(--accent); border-radius: 3px; }
.hero-line .dot { width: 16px; height: 16px; border: 4px solid var(--accent); border-radius: 50%; background: var(--surface); }
.hero-line .dot.you { background: var(--accent); }
.hero-line .dot.them { border-color: var(--match); background: var(--match); }
@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<script>
// Singapore MRT network (stations open as of 2026). Each line lists its stations in order.
// Branches (Changi Airport, Marina Bay) are their own short lists; shared names are interchanges.
const LINES = {
  NS: { name:"North-South Line", short:"NSL", color:"#d42e12", cars:6, st:[
    ["NS1","Jurong East"],["NS2","Bukit Batok"],["NS3","Bukit Gombak"],["NS4","Choa Chu Kang"],["NS5","Yew Tee"],
    ["NS7","Kranji"],["NS8","Marsiling"],["NS9","Woodlands"],["NS10","Admiralty"],["NS11","Sembawang"],["NS12","Canberra"],
    ["NS13","Yishun"],["NS14","Khatib"],["NS15","Yio Chu Kang"],["NS16","Ang Mo Kio"],["NS17","Bishan"],["NS18","Braddell"],
    ["NS19","Toa Payoh"],["NS20","Novena"],["NS21","Newton"],["NS22","Orchard"],["NS23","Somerset"],["NS24","Dhoby Ghaut"],
    ["NS25","City Hall"],["NS26","Raffles Place"],["NS27","Marina Bay"],["NS28","Marina South Pier"]] },
  EW: { name:"East-West Line", short:"EWL", color:"#009645", cars:6, st:[
    ["EW1","Pasir Ris"],["EW2","Tampines"],["EW3","Simei"],["EW4","Tanah Merah"],["EW5","Bedok"],["EW6","Kembangan"],
    ["EW7","Eunos"],["EW8","Paya Lebar"],["EW9","Aljunied"],["EW10","Kallang"],["EW11","Lavender"],["EW12","Bugis"],
    ["EW13","City Hall"],["EW14","Raffles Place"],["EW15","Tanjong Pagar"],["EW16","Outram Park"],["EW17","Tiong Bahru"],
    ["EW18","Redhill"],["EW19","Queenstown"],["EW20","Commonwealth"],["EW21","Buona Vista"],["EW22","Dover"],["EW23","Clementi"],
    ["EW24","Jurong East"],["EW25","Chinese Garden"],["EW26","Lakeside"],["EW27","Boon Lay"],["EW28","Pioneer"],["EW29","Joo Koon"],
    ["EW30","Gul Circle"],["EW31","Tuas Crescent"],["EW32","Tuas West Road"],["EW33","Tuas Link"]] },
  CG: { name:"East-West Line (Changi Airport branch)", short:"EWL", color:"#009645", cars:6, st:[
    ["EW4","Tanah Merah"],["CG1","Expo"],["CG2","Changi Airport"]] },
  NE: { name:"North East Line", short:"NEL", color:"#9900aa", cars:6, st:[
    ["NE1","HarbourFront"],["NE3","Outram Park"],["NE4","Chinatown"],["NE5","Clarke Quay"],["NE6","Dhoby Ghaut"],
    ["NE7","Little India"],["NE8","Farrer Park"],["NE9","Boon Keng"],["NE10","Potong Pasir"],["NE11","Woodleigh"],
    ["NE12","Serangoon"],["NE13","Kovan"],["NE14","Hougang"],["NE15","Buangkok"],["NE16","Sengkang"],["NE17","Punggol"],
    ["NE18","Punggol Coast"]] },
  CC: { name:"Circle Line", short:"CCL", color:"#fa9e0d", cars:3, st:[
    ["CC1","Dhoby Ghaut"],["CC2","Bras Basah"],["CC3","Esplanade"],["CC4","Promenade"],["CC5","Nicoll Highway"],
    ["CC6","Stadium"],["CC7","Mountbatten"],["CC8","Dakota"],["CC9","Paya Lebar"],["CC10","MacPherson"],["CC11","Tai Seng"],
    ["CC12","Bartley"],["CC13","Serangoon"],["CC14","Lorong Chuan"],["CC15","Bishan"],["CC16","Marymount"],["CC17","Caldecott"],
    ["CC19","Botanic Gardens"],["CC20","Farrer Road"],["CC21","Holland Village"],["CC22","Buona Vista"],["CC23","one-north"],
    ["CC24","Kent Ridge"],["CC25","Haw Par Villa"],["CC26","Pasir Panjang"],["CC27","Labrador Park"],["CC28","Telok Blangah"],
    ["CC29","HarbourFront"]] },
  CE: { name:"Circle Line (Marina Bay branch)", short:"CCL", color:"#fa9e0d", cars:3, st:[
    ["CC4","Promenade"],["CE1","Bayfront"],["CE2","Marina Bay"]] },
  DT: { name:"Downtown Line", short:"DTL", color:"#005ec4", cars:3, st:[
    ["DT1","Bukit Panjang"],["DT2","Cashew"],["DT3","Hillview"],["DT4","Hume"],["DT5","Beauty World"],["DT6","King Albert Park"],
    ["DT7","Sixth Avenue"],["DT8","Tan Kah Kee"],["DT9","Botanic Gardens"],["DT10","Stevens"],["DT11","Newton"],
    ["DT12","Little India"],["DT13","Rochor"],["DT14","Bugis"],["DT15","Promenade"],["DT16","Bayfront"],["DT17","Downtown"],
    ["DT18","Telok Ayer"],["DT19","Chinatown"],["DT20","Fort Canning"],["DT21","Bencoolen"],["DT22","Jalan Besar"],
    ["DT23","Bendemeer"],["DT24","Geylang Bahru"],["DT25","Mattar"],["DT26","MacPherson"],["DT27","Ubi"],["DT28","Kaki Bukit"],
    ["DT29","Bedok North"],["DT30","Bedok Reservoir"],["DT31","Tampines West"],["DT32","Tampines"],["DT33","Tampines East"],
    ["DT34","Upper Changi"],["DT35","Expo"]] },
  TE: { name:"Thomson-East Coast Line", short:"TEL", color:"#9d5b25", cars:4, st:[
    ["TE1","Woodlands North"],["TE2","Woodlands"],["TE3","Woodlands South"],["TE4","Springleaf"],["TE5","Lentor"],
    ["TE6","Mayflower"],["TE7","Bright Hill"],["TE8","Upper Thomson"],["TE9","Caldecott"],["TE11","Stevens"],["TE12","Napier"],
    ["TE13","Orchard Boulevard"],["TE14","Orchard"],["TE15","Great World"],["TE16","Havelock"],["TE17","Outram Park"],
    ["TE18","Maxwell"],["TE19","Shenton Way"],["TE20","Marina Bay"],["TE22","Gardens by the Bay"],["TE23","Tanjong Rhu"],
    ["TE24","Katong Park"],["TE25","Tanjong Katong"],["TE26","Marine Parade"],["TE27","Marine Terrace"],["TE28","Siglap"],
    ["TE29","Bayshore"]] },
};
const MIN_PER_STOP = 2, TRANSFER_MIN = 5;

// Every station name with all of its codes, e.g. "Outram Park" -> ["EW16","NE3","TE17"]
const STATIONS = {};
for (const [L, line] of Object.entries(LINES)) line.st.forEach(([c, n], i) => {
  (STATIONS[n] ||= { codes: [], nodes: [] });
  if (!STATIONS[n].codes.includes(c)) STATIONS[n].codes.push(c);
  STATIONS[n].nodes.push(L + "|" + i);
});
const STATION_NAMES = Object.keys(STATIONS).sort((a, b) => a.localeCompare(b));
const codes = n => STATIONS[n].codes.join(" / ");

// Fastest route between two stations (Dijkstra over line stops plus interchange walks).
// Returns legs: [{ line, idx: [station indexes on that line], times: [minute at each station] }]
const routeCache = {};
function route(from, to, t0) {
  const key = from + ">" + to;
  if (!routeCache[key]) routeCache[key] = shortest(from, to);
  const path = routeCache[key];
  if (!path) return null;
  const legs = [];
  let t = toMin(t0), prev = null;
  for (const node of path) {
    const [L, i] = node.split("|"); const n = Number(i);
    if (prev && prev.L === L) t += MIN_PER_STOP;
    else if (prev) t += TRANSFER_MIN;
    if (!prev || prev.L !== L) legs.push({ line: L, idx: [], times: [] });
    const leg = legs[legs.length - 1];
    leg.idx.push(n); leg.times.push(t);
    prev = { L };
  }
  const real = legs.filter(l => l.idx.length > 1);
  return { legs: real, minutes: t - toMin(t0), stops: real.reduce((a, l) => a + l.idx.length - 1, 0) };
}
function shortest(from, to) {
  if (from === to) return null;
  const dist = {}, back = {}, done = new Set(), goal = new Set(STATIONS[to].nodes);
  for (const n of STATIONS[from].nodes) dist[n] = 0;
  while (true) {
    let cur = null;
    for (const n in dist) if (!done.has(n) && (cur === null || dist[n] < dist[cur])) cur = n;
    if (cur === null) return null;
    if (goal.has(cur)) { const path = [cur]; while (back[path[0]]) path.unshift(back[path[0]]); return path; }
    done.add(cur);
    const [L, i] = cur.split("|"); const n = Number(i), line = LINES[L];
    const next = [];
    if (n > 0) next.push([L + "|" + (n - 1), MIN_PER_STOP]);
    if (n < line.st.length - 1) next.push([L + "|" + (n + 1), MIN_PER_STOP]);
    for (const other of STATIONS[line.st[n][1]].nodes) if (other !== cur) next.push([other, TRANSFER_MIN]);
    for (const [m, c] of next) if (!done.has(m) && (dist[m] === undefined || dist[cur] + c < dist[m])) { dist[m] = dist[cur] + c; back[m] = cur; }
  }
}

// Where does this person's ride overlap yours? Checks each of your legs against each of theirs:
// same line, same direction, sharing at least one stop.
function overlap(p) {
  const mine = myRoute(), theirs = route(p.from, p.to, p.t);
  if (!mine || !theirs) return null;
  const segs = [];
  let offset = 0;
  for (const u of mine.legs) {
    for (const v of theirs.legs) {
      if (u.line !== v.line) continue;
      const ud = Math.sign(u.idx[u.idx.length - 1] - u.idx[0]), vd = Math.sign(v.idx[v.idx.length - 1] - v.idx[0]);
      if (ud !== vd) continue;
      const common = u.idx.filter(i => v.idx.includes(i));
      if (common.length < 2) continue;
      const a = u.idx.indexOf(common[0]), at = u.times[a];
      const diff = Math.abs(at - v.times[v.idx.indexOf(common[0])]);
      segs.push({ line: u.line, start: nameOf(u.line, common[0]), end: nameOf(u.line, common[common.length - 1]),
        stops: common.length - 1, at, diff, offset: offset + a });
    }
    offset += u.idx.length - 1;
  }
  if (!segs.length) return null;
  const near = segs.filter(x => x.diff <= state.window);
  const use = near.length ? near : segs;
  return { segs: use, inWindow: near.length > 0, total: mine.stops,
    stops: use.reduce((a, x) => a + x.stops, 0), start: use[0].start, end: use[use.length - 1].end,
    at: use[0].at, diff: use[0].diff, line: use[0].line };
}

function sameAgeBand(p) { return state.age < 18 ? p.a < 18 : p.a >= 18; }

function findMatches() {
  const out = [], outsideWindow = [];
  for (const p of PEOPLE) {
    if (p.met) continue;
    if (!sameAgeBand(p) || p.a < state.minAge || p.a > state.maxAge) continue;
    const o = overlap(p);
    if (!o) continue;
    const shared = p.i.filter(x => state.interests.has(x));
    const m = { p, o, shared, score: shared.length * 3 + o.stops - o.diff / 4 };
    (o.inWindow ? out : outsideWindow).push(m);
  }
  out.sort((a, b) => b.score - a.score);
  return { out, outsideWindow };
}

// Map of Singapore with every MRT line drawn faintly and your route on top.
// Zooms to your route; "Whole map" shows the full network.
function routeMap(r) {
  const pts = [];
  r.legs.forEach((leg, k) => leg.idx.forEach((i, j) => {
    const name = nameOf(leg.line, i);
    if (k > 0 && j === 0) { pts[pts.length - 1].change = true; return; }
    pts.push({ name, xy: POS[name] });
  }));
  // Viewport: the whole island, or the route's bounding box padded out to the map's shape
  const ASPECT = 16 / 10;
  let vb;
  if (state.mapWhole) vb = [20, 10, 390, 390 / ASPECT];
  else {
    const xs = pts.map(p => p.xy[0]), ys = pts.map(p => p.xy[1]);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    let w = Math.max(x1 - x0, 40) + 80, h = Math.max(y1 - y0, 25) + 45;   // room for labels
    if (w / h < ASPECT) w = h * ASPECT; else h = w / ASPECT;
    vb = [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h];
  }
  const u = vb[2] / 360;                      // one screen pixel, in map units
  const poly = (names, cls, extra) => `<polyline class="${cls}" points="${names.map(n => POS[n].join(",")).join(" ")}" ${extra}/>`;
  const network = Object.values(LINES).map(l =>
    poly(l.st.map(x => x[1]), "net", `stroke="${l.color}"`)).join("");
  const stationDots = Object.keys(POS).map(n => `<circle class="net-dot" cx="${POS[n][0]}" cy="${POS[n][1]}" r="${1.6 * u}"/>`).join("");
  const route = r.legs.map(leg => poly(leg.idx.map(i => nameOf(leg.line, i)), "ride", `stroke="${LINES[leg.line].color}"`)).join("");
  const n = pts.length;
  const dots = pts.map((p, i) => {
    const [x, y] = p.xy, end = i === 0 || i === n - 1;
    if (p.change) return `<circle cx="${x}" cy="${y}" r="${6 * u}" class="dot-fill" stroke="#1c1f23" stroke-width="${2.5 * u}"/>`;
    return end ? `<circle cx="${x}" cy="${y}" r="${7 * u}" class="dot-end" stroke-width="${3 * u}"/>`
               : `<circle cx="${x}" cy="${y}" r="${2.4 * u}" class="dot-fill"/>`;
  }).join("");
  const label = (p, dy, cls = "map-label", dx = 0, anchor = "middle") => `<text x="${p.xy[0] + dx * u}" y="${p.xy[1] + dy * u}" text-anchor="${anchor}" class="${cls}" font-size="${12 * u}" stroke-width="${4 * u}">${esc(p.name)}</text>`;
  // When a start or end sits right next to a change, put one label above and the other below
  const changes = pts.filter(p => p.change), dyOf = new Map();
  [[pts[0], -13], [pts[n - 1], 22]].forEach(([p, dy]) => {
    const c = changes.find(c => Math.hypot(c.xy[0] - p.xy[0], c.xy[1] - p.xy[1]) < 60 * u);
    if (c) { const above = p.xy[1] < c.xy[1]; dyOf.set(p, above ? -13 : 22); dyOf.set(c, above ? 22 : -13); }
    else dyOf.set(p, dy);
  });
  const labels = [pts[0], pts[n - 1], ...changes].map(p => label(p, dyOf.get(p) ?? -13)).join("");
  const places = state.mapWhole ? ["Woodlands", "Jurong East", "Tampines", "Punggol", "Bishan"]
    .filter(m => !pts.some(p => p.name === m)).map(m => label({ name: m, xy: POS[m] }, -8, "map-place")).join("") : "";
  return `<div class="map-wrap">
    <svg class="map" viewBox="${vb.map(v => v.toFixed(1)).join(" ")}" role="img" aria-label="Map of your route from ${esc(state.from)} to ${esc(state.to)}">
      <rect x="-50" y="-50" width="550" height="400" class="water"/>
      ${SG_LAND.map(l => `<polygon points="${l}" class="land"/>`).join("")}
      ${network}${stationDots}${route}${dots}${labels}${places}
    </svg>
    <button class="map-toggle" data-mapwhole>${state.mapWhole ? "Zoom to my route" : "Whole map"}</button>
  </div>`;
}

function stationOptions(sel) {
  return STATION_NAMES.map(n => `<option value="${esc(n)}" ${n === sel ? "selected" : ""}>${esc(n)} · ${codes(n)}</option>`).join("");
}

// Your route, leg by leg, with the interchange walks in between
function routeDiagram(r) {
  return r.legs.map((leg, k) => {
    const ids = leg.idx, long = ids.length > 6;
    const shown = long ? [ids[0], ids[1], null, ids[ids.length - 2], ids[ids.length - 1]] : ids;
    const change = k > 0 ? `<div class="change small">Change at <b>${esc(nameOf(leg.line, ids[0]))}</b> · about ${TRANSFER_MIN} min walk</div>` : "";
    return `${change}<div class="leg">
      <div class="leg-head">${pill(leg.line)}<span class="small">towards ${esc(towards(leg))} · ${ids.length - 1} stop${ids.length > 2 ? "s" : ""}</span></div>
      <div class="route" style="--lc:${LINES[leg.line].color}">${shown.map((i, j) => i === null
        ? `<div class="stop gap"><span></span><span class="small muted">${ids.length - 4} more stops</span><span></span></div>`
        : `<div class="stop ${j === 0 || j === shown.length - 1 ? "end" : ""}"><span class="pin"></span><span>${esc(nameOf(leg.line, i))}</span><span class="mono code">${LINES[leg.line].st[i][0]}</span></div>`).join("")}</div>
    </div>`;
  }).join("");
}

function tabs(active) {
  const rides = findMatches().out.length, fresh = wavedAtMe().length;
  return `<div class="seg three tabs">
    <button data-go="4" aria-pressed="${active === 4}">Rides (${rides})</button>
    <button data-go="9" aria-pressed="${active === 9}">Waves${fresh ? ` <span class="badge">${fresh}</span>` : ""}</button>
    <button data-go="8" aria-pressed="${active === 8}">Met (${MET.length})</button>
  </div>`;
}

// People on your ride who waved at you and you haven't answered yet
const wavedAtMe = () => findMatches().out.filter(m => state.incoming[m.p.n] && !state.waves[m.p.n] && !state.declined[m.p.n] && !state.friends[m.p.n]);

// One person on the Waves page: where you'd ride together and what you share
function waveCard(m, actions, note) {
  const { p, o, shared } = m;
  return `<article class="card">
    <div class="who"><div class="avatar">${esc(p.n[0])}</div>
      <div class="meta"><h3>${esc(p.n)}, ${p.a}</h3><p class="small muted">${esc(p.bio)}</p></div></div>
    <span class="small">${[...new Set(o.segs.map(x => x.line))].map(pill).join(" ")} <b>${o.stops} stop${o.stops > 1 ? "s" : ""} together</b> · from ${esc(o.start)} · around ${fmt(o.at)}</span>
    ${shared.length ? `<div class="chips">${shared.map(x => `<span class="tag shared">${x}</span>`).join("")}</div>` : ""}
    ${note ? `<p class="small muted">${note}</p>` : ""}
    <div class="actions">${actions}</div>
  </article>`;
}

// A met person's current stage: the made-up starting point, or whatever your feedback led to
function metStatus(m) {
  const d = state.done[m.n];
  if (!d) return m;
  const f = d.fb;
  if (f.rate === "noshow") return { ...m, status: "noshow" };
  const wanted = f.again === "yes" || f.share === "yes";
  if (wanted && d.theySayNo) return { ...m, status: "nosecond" };
  if (f.share === "yes") return { ...m, status: "friends", handle: extra(m).handle, next: f.again === "yes" ? "Next Monday · same train" : null };
  if (f.again === "yes") return { ...m, status: "again", next: "Next Monday · same train" };
  return { ...m, status: "done" };
}

        incoming.map(m => waveCard(m,
          `<button class="btn small-btn" data-waveback="${esc(m.p.n)}">Wave back</button><button class="btn ghost small-btn" data-notnow="${esc(m.p.n)}">Not now</button>`,
          `Waved ${esc(state.incoming[m.p.n])}`)),
        "Nobody new. When someone on your ride waves at you, they show up here.")}
      ${section(`Ready to plan <span class="count">${ready.length}</span>`, "You both waved.",
        ready.map(m => waveCard(m, `<button class="btn small-btn" data-plan="${esc(m.p.n)}">Plan a ride</button>`)),
        "When you and someone both wave, you can plan a ride here.")}
      ${section(`You waved at <span class="count">${sent.length}</span>`, "The people you want to meet. You'll get a match when they wave back.",
        sent.map(m => waveCard(m,
          `<span class="pill-status warn">Waiting</span><span class="spacer"></span><button class="btn ghost small-btn" data-unwave="${esc(m.p.n)}">Take back wave</button>`,
          state.sentWhen[m.p.n] ? `Sent ${esc(state.sentWhen[m.p.n])}` : "Sent just now")),
        `Nobody yet. Go to <b>Rides</b> and wave at someone you'd like to meet.`)}
      <div class="note">Waves last 7 days. If nobody waves back, the wave quietly ends. "Not now" is private: they're never told.</div>
    </main>`;
  },
  8() {
    const order = { feedback: 0, friends: 1, again: 2, done: 3, nosecond: 4, noshow: 5 };
    const list = MET.map(metStatus).sort((a, b) => order[a.status] - order[b.status]);
    const cards = list.map(m => {
      const row = {
        feedback: `<span class="pill-status warn">Waiting for your feedback</span><span class="spacer"></span><button class="btn small-btn" data-feedback="${esc(m.n)}">How did it go?</button>`,
        friends: `<span class="pill-status good">Friends</span><span class="mono small">Telegram ${esc(m.handle)}</span>`,
        again: `<span class="pill-status good">Riding again</span>`,
        done: `<span class="small muted">Feedback sent. No second ride planned.</span>`,
        nosecond: `<span class="small muted">No second ride this time</span>`,
        noshow: `<span class="small muted">Didn't show up. Ride missed.</span>`,
      }[m.status];
      const extraRow = m.status === "friends"
        ? `<div class="actions"><button class="btn ghost small-btn" data-toast="Ride request sent to ${esc(m.n)}.">Plan another ride</button><button class="btn ghost small-btn" data-toast="Opening Telegram…">Message</button></div>`
        : m.next ? `<p class="small"><b>Next ride:</b> ${esc(m.next)}</p>` : "";
      return `<article class="card ${m.status === "noshow" || m.status === "nosecond" ? "faded" : ""}">
        <div class="who"><div class="avatar">${esc(m.n[0])}</div>
          <div class="meta"><h3>${esc(m.n)}, ${m.a}</h3><p class="small muted">${esc(m.when)}</p></div></div>
        <p class="small muted">${esc(m.bio)}</p>
        <div class="actions">${row}</div>
        ${extraRow}
      </article>`;
    }).join("");
    const friends = list.filter(m => m.status === "friends").length;
    return `${header(3)}
    <main class="fade">
      ${tabs(8)}
      <div>
        <p class="label">Your rides so far</p>
        <h2>${MET.length} people met · ${friends} friend${friends === 1 ? "" : "s"}</h2>
      </div>
      <div class="list">${cards}</div>
      <div class="note">Only you can see this list. Ratings stay private, and people who said no are never named as the ones who said no.</div>
    </main>`;
  },
  7() {
    const p = PEOPLE.find(x => x.n === state.planFor);
    const x = extra(p), f = state.fb;
    if (state.fromMet) state.done[p.n] = { fb: { ...f }, theySayNo: state.theySayNo };
    const home = state.fromMet ? 8 : 4, homeLabel = state.fromMet ? "Back to people you've met" : "Back to my matches";
    const m = findMatches().out.find(r => r.p.n === p.n);
    if (f.rate === "noshow") {
      return `${header(null)}<main class="fade">
        <h2>Sorry ${esc(p.n)} didn't show</h2>
        <p class="muted">We've noted the missed ride. People who often miss rides get fewer matches, so the people who turn up get better ones.</p>
        <div class="spacer"></div><button class="btn" data-go="${home}">${homeLabel}</button></main>`;
    }
    const wanted = f.again === "yes" || f.share === "yes";
    if (wanted && state.theySayNo) {
      return `${header(null)}<main class="fade">
        <div><p class="label">Two days later</p><h2>No second ride this time</h2></div>
        <p class="muted">${esc(p.n)} didn't pick a second ride or a contact swap. That happens, and it's not about you. Nobody saw what you chose.</p>
        <p class="muted">There are other people on your train.</p>
        <button class="back" data-they style="color:var(--accent);font-weight:600;text-align:left">Demo: switch back to ${esc(p.n)} saying yes</button>
        <div class="spacer"></div><button class="btn" data-go="${home}">${homeLabel}</button></main>`;
    }
    const again = f.again === "yes", share = f.share === "yes";
    const blocks = [];
    if (again) blocks.push(`<div class="ticket">
      <span class="label" style="color:var(--match)">You both want to ride again</span>
      <span class="big">Next Monday, ${m ? fmt(m.o.at) : state.time}</span>
      <span>Same train${m ? ` at ${esc(m.o.start)}` : ""}, carriage ${state.car}</span>
      <button class="btn small-btn" data-toast="Next ride with ${esc(p.n)} is booked for Monday.">Book it</button>
    </div>`);
    if (share) blocks.push(`<div class="card">
      <span class="label">Contacts shared</span>
      <div class="who"><div class="avatar">${esc(p.n[0])}</div>
        <div class="meta"><h3>${esc(p.n)}</h3><p class="mono">Telegram ${esc(x.handle)}</p></div></div>
      <p class="small muted">${esc(p.n)} got your ${esc(f.ctype)}${f.handle.trim() ? `: <span class="mono">${esc(f.handle)}</span>` : ""}. Plan something outside the commute!</p>
    </div>`);
    return `${header(null)}
    <main class="fade">
      <div>
        <p class="label">Feedback sent</p>
        <h2>${share ? `You and ${esc(p.n)} are now friends` : again ? "See you on the train" : "Thanks for the feedback"}</h2>
      </div>
      ${blocks.join("") || `<p class="muted">${esc(p.n)} won't see your answers. We'll use them to find you better matches.</p>`}
      ${blocks.length ? `<button class="back" data-they style="color:var(--accent);font-weight:600;text-align:left">Demo: see what happens if ${esc(p.n)} says no</button>` : ""}
      <div class="spacer"></div>
      <button class="btn ghost" data-go="${home}">${homeLabel}</button>
    </main>`;
  }
};

function render() { app.innerHTML = screens[state.step](); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
}

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.setup !== undefined) state.setup = true;
  if (d.go !== undefined) { if (Number(d.go) === 4) state.plan = null; go(Number(d.go)); }
  else if (d.interest) { state.interests.has(d.interest) ? state.interests.delete(d.interest) : state.interests.add(d.interest); render(); }
  else if (d.mode) { state.mode = d.mode; render(); }
  else if (d.wave) {
    const n = d.wave; state.waves[n] = "sent"; render();
    setTimeout(() => { state.waves[n] = "mutual"; if (state.step === 4 || state.step === 9) render(); toast(n + " waved back"); }, 1400);
  }
  else if (d.waveback) { state.waves[d.waveback] = "mutual"; render(); toast("You both waved. Plan a ride with " + d.waveback + "."); }
  else if (d.notnow) { state.declined[d.notnow] = true; render(); toast(d.notnow + " won't be told."); }
  else if (d.unwave) { delete state.waves[d.unwave]; render(); toast("Wave taken back."); }
  else if (d.plan) { state.planFor = d.plan; state.plan = null; state.fromMet = false; go(5); }
  else if (d.feedback) {
    state.planFor = d.feedback; state.fromMet = true;
    state.fb = { rate: null, again: null, share: null, ctype: "Telegram", handle: "" };
    go(6);
  }
  else if (d.q) {
    if (state.questions.has(d.q)) state.questions.delete(d.q);
    else if (state.questions.size >= 3) { toast("Pick up to 3. Tap one to remove it first."); return; }
    else state.questions.add(d.q);
    render();
  }
  else if (d.fb) { state.fb[d.fb] = d.val; render(); }
  else if (d.submit !== undefined) {
    state.theySayNo = false;
    if (state.fb.rate !== "noshow" && state.fb.share === "yes") state.friends[state.planFor] = true;
    go(7);
  }
  else if (d.they !== undefined) {
    state.theySayNo = !state.theySayNo;
    if (state.fb.share === "yes") { if (state.theySayNo) delete state.friends[state.planFor]; else state.friends[state.planFor] = true; }
    render();
  }
  else if (d.mapwhole !== undefined) { state.mapWhole = !state.mapWhole; render(); }
  else if (d.meet !== undefined) go(state.setup ? 4 : 2);
  else if (d.swap !== undefined) { [state.from, state.to] = [state.to, state.from]; render(); }
  else if (d.trip) { [state.from, state.to] = d.trip.split("|"); render(); }
  else if (d.try !== undefined) { state.from = "Marine Terrace"; state.to = "Raffles Place"; render(); }
  else if (d.widen !== undefined) { state.window = 15; render(); }
  else if (d.day) { state.day = d.day; render(); }
  else if (d.car) { state.car = Number(d.car); render(); }
  else if (d.confirm !== undefined) {
    if (!state.spot.trim()) { toast("Add how " + state.planFor + " can spot you."); document.getElementById("spot").focus(); return; }
    state.plan = true; state.fromMet = false; state.fb = { rate: null, again: null, share: null, ctype: "Telegram", handle: "" };
    render(); window.scrollTo(0, 0); toast("Plan sent to " + state.planFor);
  }
  else if (d.late !== undefined) { toast(state.planFor + " knows you're running late. They'll save you a spot."); }
  else if (d.toast) { toast(d.toast); }
});

// Text fields update quietly so typing isn't interrupted by a re-render
app.addEventListener("input", e => {
  const t = e.target, k = t.dataset.keep;
  if (k === "spot") state.spot = t.value;
  if (k === "ans") state.answers[t.dataset.question] = t.value;
  if (k === "handle") state.fb.handle = t.value;
});

app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.keep) return;
  if (t.id === "from") state.from = t.value;
  if (t.id === "to") state.to = t.value;
  if (t.id === "time" && t.value) state.time = t.value;
  if (t.id === "window") state.window = Number(t.value);
  if (t.id === "minAge") { state.minAge = Number(t.value); if (state.maxAge < state.minAge) state.maxAge = state.minAge; }
  if (t.id === "maxAge") { state.maxAge = Number(t.value); if (state.minAge > state.maxAge) state.minAge = state.maxAge; }
  if (t.id === "age") {
    const wasMinor = state.age < 18; state.age = Number(t.value);
    if (wasMinor !== state.age < 18) {
      if (state.age < 18) { state.minAge = Math.max(13, state.age - 2); state.maxAge = 17; }
      else { state.minAge = 18; state.maxAge = Math.min(60, state.age + 5); }
    }
  }
  render();
});

render();
</script>
